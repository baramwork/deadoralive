name: research-panic-dip

# panic_dip study (research/panic_dip/SPEC.md, pre-registered 2026-11-01): fetch raw daily OHLC for
# every S&P 500 point-in-time constituent + SPY from Yahoo (this sandbox-free runner is the only
# place that can reach it), self-test, run the backtest, commit research/panic_dip/results/.
# Results are pushed to the SAME branch the workflow ran on — never to main by default.
on:
  # Also runs on a push to its own branch (code or spec changes only — never the results the
  # run itself commits back, which are excluded below and are pushed with GITHUB_TOKEN anyway).
  # SMOKE_LIMIT below is the fallback when no dispatch input is given: "20" = smoke run on the
  # first 20 tickers, "" = full universe.
  push:
    branches: [research/panic-dip]
    paths:
      - ".github/workflows/research-panic-dip.yml"
      - "research/panic_dip/**"
      - "!research/panic_dip/results/**"
  workflow_dispatch:
    inputs:
      limit:
        description: "fetch only the first N constituents tickers (blank = all ~750; use e.g. 20 for a smoke run)"
        required: false
        default: ""
      placebo_n:
        description: "placebo runs per variant and period (SPEC: 100)"
        required: false
        default: "100"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests
      - name: Fetch prices
        # data/panic_dip/ is gitignored, so a fresh checkout has none. ~750 tickers x 0.25 s sleep
        # + request time is on the order of 10-20 minutes; 429/5xx are retried with backoff.
        shell: bash
        env:
          SMOKE_LIMIT: "20"
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          mkdir -p research/panic_dip/results
          ARGS=""
          LIMIT="${LIMIT:-$SMOKE_LIMIT}"
          if [ -n "$LIMIT" ]; then
            case "$LIMIT" in
              ''|*[!0-9]*) echo "limit must be a positive integer, got: $LIMIT"; exit 1 ;;
            esac
            ARGS="--limit $LIMIT"
          fi
          python research/panic_dip/fetch_prices.py $ARGS 2>&1 | tee research/panic_dip/results/fetch.log
          ls data/panic_dip | wc -l >> research/panic_dip/results/fetch.log
      - name: Tests
        shell: bash
        run: |
          python research/panic_dip/tests_panic_dip.py
          python research/panic_dip/run_panic_dip.py --synthetic
      - name: Run study
        shell: bash
        env:
          SMOKE_PLACEBO_N: "5"
          PLACEBO_N: ${{ github.event.inputs.placebo_n }}
        run: |
          ARGS=""
          PLACEBO_N="${PLACEBO_N:-$SMOKE_PLACEBO_N}"
          if [ -n "$PLACEBO_N" ]; then
            case "$PLACEBO_N" in
              ''|*[!0-9]*) echo "placebo_n must be a positive integer, got: $PLACEBO_N"; exit 1 ;;
            esac
            ARGS="--placebo-n $PLACEBO_N"
          fi
          python research/panic_dip/run_panic_dip.py $ARGS 2>&1 | tee research/panic_dip/results/run.log
      - name: Commit results
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "deadoralive-bot"
          git config user.email "deadoralive-bot@users.noreply.github.com"
          git add -f research/panic_dip/results/
          git commit -m "research: panic_dip run ($(date -u +%F))" || echo "nothing to commit"
          git pull --rebase origin "$REF_NAME" || true
          git push origin "HEAD:$REF_NAME"
